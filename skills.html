<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>技能 · YOUCAI</title>
  <link rel="stylesheet" href="staggered-menu.css">
  <link rel="stylesheet" href="subpage.css">
  <link rel="stylesheet" href="bubble-tools.css">
</head>
<body>

  <!-- ===== StaggeredMenu 金色错峰导航（原生 JS 移植自 React Bits） ===== -->
  <div class="sm-wrapper" id="sm-root" data-position="right">
    <div class="sm-prelayers" id="sm-prelayers" aria-hidden="true"></div>
    <header class="sm-header">
      <a href="index.html" class="sm-logo" aria-label="YOUCAI 首页">YOUCAI</a>
      <button class="sm-toggle" id="sm-toggle" aria-label="打开菜单" aria-expanded="false" aria-controls="sm-panel" type="button">
        <span class="sm-icon" id="sm-icon" aria-hidden="true">
          <span class="sm-bar sm-bar-top" id="sm-barTop"></span>
          <span class="sm-bar sm-bar-mid" id="sm-barMid"></span>
          <span class="sm-bar sm-bar-bot" id="sm-barBot"></span>
        </span>
      </button>
    </header>
    <aside class="sm-panel" id="sm-panel" aria-hidden="true">
      <div class="sm-panel-inner">
        <ul class="sm-list" id="sm-list" role="list"></ul>
        <div class="sm-socials" id="sm-socials">
          <h3 class="sm-socials-title">社交</h3>
          <ul class="sm-socials-list" id="sm-socials-list" role="list"></ul>
        </div>
      </div>
    </aside>
  </div>

  <div class="vignette"></div>

  <main class="page-content">
    <h1 class="page-title">技能</h1>
    <p class="page-sub">Skills &amp; Tools</p>

    <p class="lede muted">工欲善其事，必先利其器。以下是我在数字化设计与三维创作中常用的工具体系。</p>

    <div class="tool-pill-grid" id="toolPillGrid" aria-label="常用英文工具">
      <span class="tool-pill" style="--item-rot:-8deg"><span class="tool-pill-label">Photoshop</span></span>
      <span class="tool-pill" style="--item-rot:8deg"><span class="tool-pill-label">Illustrator</span></span>
      <span class="tool-pill" style="--item-rot:-8deg"><span class="tool-pill-label">After Effects</span></span>
      <span class="tool-pill" style="--item-rot:8deg"><span class="tool-pill-label">Premiere Pro</span></span>
      <span class="tool-pill" style="--item-rot:-8deg"><span class="tool-pill-label">Capcut</span></span>
      <span class="tool-pill" style="--item-rot:8deg"><span class="tool-pill-label">Cinema 4D</span></span>
      <span class="tool-pill" style="--item-rot:-8deg"><span class="tool-pill-label">KeyShot</span></span>
      <span class="tool-pill" style="--item-rot:8deg"><span class="tool-pill-label">Ocante</span></span>
      <span class="tool-pill" style="--item-rot:-8deg"><span class="tool-pill-label">Gemini</span></span>
      <span class="tool-pill" style="--item-rot:8deg"><span class="tool-pill-label">Chatgpt</span></span>
      <span class="tool-pill" style="--item-rot:-8deg"><span class="tool-pill-label">Dreamina</span></span>
    </div>

    <!-- 解析到网格立即隐藏 pill，杜绝切页时闪现（GSAP 接管后由 bubble-tools.js 移除） -->
    <script>
      (function () {
        var g = document.getElementById('toolPillGrid');
        if (g) g.classList.add('preload');
      })();
    </script>
  </main>

  <script src="water-bg.js"></script>
  <script src="color-bends.js"></script>
  <script src="vendor/gsap.min.js"></script>
  <script src="staggered-menu.js"></script>
  <script src="subpage.js"></script>
  <script src="bubble-tools.js"></script>
</body>
</html>
