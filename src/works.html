<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品集 — YOUCAI 亚马逊电商设计师</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="lightbox.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #d4a857;
      --gold-light: #f0d089;
      --gold-dark: #c98a3b;
      --bg: #0a0a0a;
      --bg-card: #141414;
      --bg-card-hover: #1a1a1a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: #f5f5f5;
      font-family: 'Inter', 'Noto Serif SC', sans-serif;
      overflow-x: hidden;
    }
    .font-serif { font-family: 'Noto Serif SC', serif; }

    /* ========== Background ========== */
    .bg-bokeh {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .bokeh-orb {
      position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.12;
    }
    .orb-1 { width: 500px; height: 500px; background: #d4a857; top: -10%; right: -5%; }
    .orb-2 { width: 400px; height: 400px; background: #c98a3b; bottom: 10%; left: -8%; }
    .orb-3 { width: 300px; height: 300px; background: #f0d089; top: 40%; left: 50%; opacity: 0.06; }
    .vignette {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
    }

    /* ========== Header ========== */
    .site-header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10, 10, 10, 0.7);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .header-inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      color: rgba(255,255,255,0.5); font-size: 14px;
      transition: color 0.3s;
    }
    .back-link:hover { color: var(--gold-light); }

    /* ========== Title section ========== */
    .title-section {
      position: relative; z-index: 10;
      text-align: center;
      padding: 80px 24px 40px;
    }
    .title-section h1 {
      font-family: 'Noto Serif SC', serif;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 16px;
    }
    .title-section h1 .accent {
      background: linear-gradient(135deg, #f0d089, #d4a857, #c98a3b);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .title-section p {
      color: rgba(255,255,255,0.4); font-size: 15px; max-width: 480px; margin: 0 auto;
      line-height: 1.7;
    }

    /* ========== Filter bar ========== */
    .filter-bar {
      position: relative; z-index: 10;
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 10px; padding: 0 24px 48px;
    }
    .filter-pill {
      padding: 8px 22px;
      border-radius: 999px;
      font-size: 13px; font-weight: 500;
      letter-spacing: 0.03em;
      color: rgba(255,255,255,0.45);
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
    }
    .filter-pill:hover {
      color: rgba(255,255,255,0.8);
      border-color: rgba(212,168,87,0.3);
      background: rgba(212,168,87,0.06);
    }
    .filter-pill.active {
      color: #0a0a0a;
      background: linear-gradient(135deg, #f0d089, #d4a857);
      border-color: transparent;
      box-shadow: 0 4px 20px rgba(212,168,87,0.3);
    }
    .filter-count {
      font-size: 11px; opacity: 0.6; margin-left: 4px;
    }

    /* ========== Works grid ========== */
    .works-grid {
      position: relative; z-index: 10;
      max-width: 1200px; margin: 0 auto;
      padding: 0 24px 80px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }
    .work-card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0;
      transform: translateY(30px);
      animation: cardIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .work-card:hover {
      border-color: rgba(212,168,87,0.3);
      box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(212,168,87,0.1);
      transform: translateY(-4px);
    }
    .work-card.hidden {
      display: none;
    }
    @keyframes cardIn {
      to { opacity: 1; transform: translateY(0); }
    }
    .work-card-thumb {
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #0f0f0f;
    }
    .work-card-thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .work-card:hover .work-card-thumb img {
      transform: scale(1.06);
    }
    .work-card-thumb::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.7) 100%);
      opacity: 0;
      transition: opacity 0.4s;
    }
    .work-card:hover .work-card-thumb::after {
      opacity: 1;
    }
    .work-card-badge {
      position: absolute; top: 14px; left: 14px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--gold-light);
      background: rgba(10,10,10,0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(212,168,87,0.25);
    }
    .work-card-overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 20px;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .work-card:hover .work-card-overlay {
      transform: translateY(0);
    }
    .work-card-overlay .view-btn {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--gold-light); font-size: 13px; font-weight: 500;
    }
    .work-card-info {
      padding: 18px 20px;
    }
    .work-card-info h3 {
      font-size: 16px; font-weight: 600; color: #f5f5f5;
      margin-bottom: 4px;
    }
    .work-card-info p {
      font-size: 12px; color: rgba(255,255,255,0.35);
      letter-spacing: 0.03em;
    }

    /* ========== Empty state ========== */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center; padding: 80px 20px;
      color: rgba(255,255,255,0.25);
    }
    .empty-state svg { margin: 0 auto 16px; opacity: 0.3; }

    /* ========== Detail overlay ========== */
    .detail-overlay {
      position: fixed; inset: 0; z-index: 10000;
      background: #0a0a0a;
      overflow-y: auto;
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .detail-overlay.active {
      opacity: 1; pointer-events: auto;
    }
    .detail-header {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 24px;
      background: rgba(10,10,10,0.88);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .detail-header-title {
      font-size: 14px; color: var(--gold-light); font-weight: 500;
    }
    .detail-nav {
      display: flex; align-items: center; gap: 10px;
    }
    .detail-nav-btn {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #f5f5f5; cursor: pointer;
      transition: all 0.3s;
    }
    .detail-nav-btn:hover {
      background: rgba(212,168,87,0.15);
      color: var(--gold-light);
      border-color: rgba(212,168,87,0.3);
    }
    .detail-nav-btn:disabled {
      opacity: 0.25; cursor: not-allowed;
    }
    .detail-close {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #f5f5f5; cursor: pointer;
      transition: all 0.3s; margin-left: 6px;
    }
    .detail-close:hover {
      background: rgba(239,68,68,0.15);
      border-color: rgba(239,68,68,0.3);
      color: #f87171;
    }
    .detail-body {
      max-width: 900px; margin: 0 auto;
      padding: 40px 20px 100px;
    }

    /* Gallery (main images) */
    .gallery-main {
      width: 100%; aspect-ratio: 1 / 1;
      border-radius: 16px; overflow: hidden;
      background: #141414;
      border: 1px solid rgba(255,255,255,0.06);
      position: relative;
    }
    .gallery-main img {
      width: 100%; height: 100%; object-fit: contain;
    }
    .gallery-thumbs {
      display: flex; gap: 10px; margin-top: 14px;
      overflow-x: auto; padding-bottom: 4px;
      scrollbar-width: thin; scrollbar-color: rgba(212,168,87,0.3) transparent;
    }
    .gallery-thumbs::-webkit-scrollbar { height: 4px; }
    .gallery-thumbs::-webkit-scrollbar-thumb { background: rgba(212,168,87,0.3); border-radius: 2px; }
    .gallery-thumb {
      width: 56px; height: 56px; border-radius: 10px;
      overflow: hidden; border: 2px solid transparent;
      cursor: pointer; flex-shrink: 0; background: #141414;
      transition: border-color 0.3s;
    }
    .gallery-thumb:hover { border-color: rgba(212,168,87,0.4); }
    .gallery-thumb.active { border-color: var(--gold); }
    .gallery-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .gallery-counter {
      position: absolute; bottom: 12px; right: 14px;
      padding: 4px 12px; border-radius: 999px;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
      font-size: 12px; color: rgba(255,255,255,0.6);
      pointer-events: none;
    }

    /* Section labels */
    .detail-label {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 11px; letter-spacing: 0.25em;
      color: rgba(212,168,87,0.6); text-transform: uppercase;
      margin: 48px 0 16px;
    }
    .detail-label::before {
      content: ''; width: 24px; height: 1px;
      background: rgba(212,168,87,0.3);
    }
    .detail-desc {
      color: rgba(255,255,255,0.5); font-size: 14px;
      line-height: 1.8; max-width: 600px; margin-bottom: 28px;
    }

    /* A+ section（强无缝：容器始终 column-flex，gapped 才加 gap） */
    .aplus-container { width: 100%; display: flex; flex-direction: column; }
    .aplus-container.gapped { gap: 16px; }
    .aplus-item {
      width: 100%; display: flex; justify-content: center;
      overflow: hidden; background: #141414; line-height: 0; font-size: 0;
      margin: 0; padding: 0;
    }
    .aplus-item.gapped { border-radius: 12px; }
    .aplus-item img { width: 100%; height: auto; display: block; }
    .aplus-size-970 { max-width: 970px; margin: 0 auto; }
    .aplus-size-1460 { max-width: 1460px; margin: 0 auto; }

    /* Image placeholder */
    .img-placeholder {
      width: 100%; aspect-ratio: 4/3;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 10px;
      color: rgba(212,168,87,0.3);
      background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border: 1px dashed rgba(212,168,87,0.15);
      border-radius: 12px;
    }
    .img-placeholder p {
      font-size: 12px; text-align: center; padding: 0 20px; line-height: 1.6;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .works-grid { grid-template-columns: 1fr; gap: 16px; }
      .title-section { padding: 48px 20px 24px; }
      .filter-bar { gap: 8px; padding-bottom: 32px; }
      .filter-pill { padding: 7px 16px; font-size: 12px; }
      .detail-body { padding: 24px 16px 80px; }
    }

    /* ========== Edit Mode ========== */
    body.edit-mode [data-edit] {
      outline: 1px dashed rgba(212,168,87,0.5);
      outline-offset: 2px;
      cursor: text;
      border-radius: 4px;
    }
    body.edit-mode [data-edit]:hover { background: rgba(212,168,87,0.08); }
    body.edit-mode [data-edit]:focus { outline: 2px solid var(--gold); background: rgba(212,168,87,0.12); }
    .edit-toolbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9900;
      display: none; align-items: center; justify-content: space-between;
      padding: 10px 24px;
      background: linear-gradient(135deg, #1a1a1a, #0f0f0f);
      border-bottom: 1px solid rgba(212,168,87,0.3);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5); font-size: 13px;
    }
    .edit-toolbar.active { display: flex; }
    .edit-toolbar .edit-info { color: #e8b864; display: flex; align-items: center; gap: 8px; }
    .edit-toolbar .edit-actions { display: flex; align-items: center; gap: 10px; }
    .edit-toolbar button {
      padding: 6px 18px; border-radius: 8px; font-size: 12px; font-weight: 600;
      cursor: pointer; border: none; transition: all 0.2s; font-family: inherit;
    }
    .edit-toolbar .btn-save { background: linear-gradient(135deg, #d4a857, #c98a3b); color: #1a1205; }
    .edit-toolbar .btn-save:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(212,168,87,0.4); }
    .edit-toolbar .btn-export { background: rgba(212,168,87,0.15); color: #e8b864; border: 1px solid rgba(212,168,87,0.4); }
    .edit-toolbar .btn-export:hover { background: rgba(212,168,87,0.28); }
    .edit-toolbar .btn-exit { background: rgba(255,255,255,0.08); color: #f5f5f5; border: 1px solid rgba(255,255,255,0.15); }
    .edit-toolbar .btn-exit:hover { background: rgba(255,255,255,0.15); }
    .edit-hint {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 9900; display: none; padding: 8px 20px;
      background: rgba(10,10,10,0.9); border: 1px solid rgba(212,168,87,0.3);
      border-radius: 999px; color: #e8b864; font-size: 12px; backdrop-filter: blur(10px);
    }
    .edit-hint.active { display: block; }
  </style>
</head>

    // 创建图片元素（带加载失败占位）
    function createImg(src, alt, placeholderText) {
      const img = document.createElement('img');
      img.src = src;
      img.alt = alt || '';
      img.loading = 'lazy';
      img.onerror = function() { img.style.display = 'none'; };
      return img;
    }

    // 创建媒体元素（自动识别图片 / 视频）
    function createMedia(src, alt, placeholderText, opts) {
      opts = opts || {};
      const ext = src.split('.').pop().toLowerCase();
      const isVideo = ['mp4', 'webm', 'mov', 'm4v', 'ogg'].includes(ext);
      let el;
      if (isVideo) {
        el = document.createElement('video');
        el.src = src;
        el.controls = true;
        el.preload = 'metadata';
        el.loop = true;
        el.muted = true;
        el.playsInline = true;
        if (opts.objectFit) el.style.objectFit = opts.objectFit;
      } else {
        el = document.createElement('img');
        el.src = src;
        el.alt = alt || '';
        el.loading = 'lazy';
        if (opts.objectFit) el.style.objectFit = opts.objectFit;
      }
      el.onerror = function() { el.style.display = 'none'; };
      return el;
    }

    // 拼接媒体路径并编码中文（兼容 Vercel 部署的中文目录）
    function mediaSrc(folder, file) {
      return encodeURI('images/' + folder + file);
    }

    // 从 folder 路径提取作品名（如 "美妆/美白霜M/" -> "美白霜M"）
    function folderName(folder) {
      return folder.replace(/\/$/, '').split('/').pop();
    }

    // 判断文件是否为视频
    function isVideoFile(file) {
      return /\.(mp4|webm|mov|m4v|ogg)$/i.test(file);
    }

    // 探测媒体文件是否真实存在（缺失即不显示，不裂图、不占位）
    function mediaExists(src) {
      return new Promise((resolve) => {
        const ext = src.split('.').pop().split('?')[0].toLowerCase();
        const isVideo = ['mp4','webm','mov','m4v','ogg'].includes(ext);
        let probe;
        if (isVideo) {
          probe = document.createElement('video');
          probe.preload = 'metadata';
          probe.onloadeddata = () => resolve(true);
          probe.onerror = () => resolve(false);
        } else {
          probe = new Image();
          probe.onload = () => resolve(true);
          probe.onerror = () => resolve(false);
        }
        probe.src = src;
        setTimeout(() => resolve(false), 12000); // 超时保护
      });
    }
    // 过滤出真实存在的文件（只渲染存在的，缺失的留空）
    async function filterExisting(folder, files) {
      if (!files || !files.length) return [];
      const srcs = files.map(f => mediaSrc(folder, f));
      const ok = await Promise.all(srcs.map(s => mediaExists(s)));
      return files.filter((f, i) => ok[i]);
    }

    async function renderDetail() {
      const work = works[currentDetailIndex];
      if (!work) return;

      const dtKey = 'detail-title-' + currentDetailIndex;
      detailTitle.dataset.edit = dtKey;
      detailTitle.textContent = window.getOverride(dtKey, folderName(work.folder) + ' — ' + work.category);

      // A+ 图片：直接渲染全部，缺失文件由 createMedia 的 onerror 自动隐藏（不再逐个探测，避免打开详情卡顿）
      const aplusList = (work.aplus.images || []);
      const aplusClass = work.aplus.mode === 'gapped' ? 'gapped' : '';
      const itemClass = work.aplus.mode === 'gapped' ? 'aplus-item gapped' : 'aplus-item';
      html += '<div class="aplus-container ' + aplusClass + '">';
      aplusList.forEach((a, i) => {
        const sizeClass = a.width === 1460 ? 'aplus-size-1460' : 'aplus-size-970';
        html += '<div class="' + itemClass + ' ' + sizeClass + '" id="aplus-' + i + '"></div>';
      });
      html += '</div>';

      detailBody.innerHTML = html;

      // 填充主图画廊
      const galleryMain = document.getElementById('gallery-main');
      const galleryThumbs = document.getElementById('gallery-thumbs');
      let currentImg = 0;
      const mainMedia = (work.main || []).slice();
      const mainImageFiles = mainMedia.filter(f => !isVideoFile(f));
      const aplusImageFiles = aplusList.filter(a => !isVideoFile(a.file));
      const lightboxUrls = mainImageFiles.map(f => mediaSrc(work.folder, f))
        .concat(aplusImageFiles.map(a => mediaSrc(work.folder, a.file)));

      // 主图轨道（支持滑动切换 + 点击放大）
      galleryMain.innerHTML = '';
      galleryMain.style.cssText = 'position:relative; width:100%; overflow:hidden; aspect-ratio:1/1;';
      let track, counter;
      let recentSwipe = false;

      if (mainMedia.length === 0) {
        galleryMain.innerHTML = '<div class="empty-media" style="display:flex;align-items:center;justify-content:center;height:100%;color:rgba(255,255,255,0.4);">暂无主图</div>';
      } else {
        track = document.createElement('div');
        track.className = 'gallery-track';
        track.style.cssText = 'display:flex;height:100%;width:' + (mainMedia.length * 100) + '%;transition:transform 0.35s cubic-bezier(0.25,1,0.5,1);will-change:transform;';
        mainMedia.forEach((f, i) => {
          const slide = document.createElement('div');
          slide.style.cssText = 'flex:0 0 ' + (100 / mainMedia.length) + '%;display:flex;align-items:center;justify-content:center;overflow:hidden;';
          const media = createMedia(mediaSrc(work.folder, f), folderName(work.folder) + ' 主图 ' + (i + 1), '放媒体: ' + f);
          media.style.cssText = 'width:100%;height:100%;object-fit:contain;cursor:zoom-in;user-select:none;-webkit-user-drag:none;';
          if (media.tagName === 'IMG') {
            media.addEventListener('click', () => {
              if (recentSwipe) return;
              const idx = mainImageFiles.indexOf(f);
              if (idx >= 0) openLightbox(lightboxUrls, idx);
            });
          }
          slide.appendChild(media);
          track.appendChild(slide);
        });
        galleryMain.appendChild(track);

        counter = document.createElement('div');
        counter.className = 'gallery-counter';
        counter.style.cssText = 'position:absolute;bottom:12px;right:16px;background:rgba(0,0,0,0.5);color:#fff;padding:4px 10px;border-radius:20px;font-size:12px;';
        counter.textContent = '1 / ' + mainMedia.length;
        galleryMain.appendChild(counter);
      }

      // 渲染缩略图
      mainMedia.forEach((f, i) => {
        const thumb = document.createElement('div');
        thumb.className = 'gallery-thumb' + (i === 0 ? ' active' : '');
        const media = createMedia(mediaSrc(work.folder, f), '缩略图 ' + (i + 1));
        thumb.appendChild(media);
        thumb.addEventListener('click', () => showMain(i));
        galleryThumbs.appendChild(thumb);
      });

      function showMain(idx, animate) {
        if (!track) return;
        currentImg = idx;
        track.style.transition = animate !== false ? 'transform 0.35s cubic-bezier(0.25, 1, 0.5, 1)' : 'none';
        track.style.transform = 'translateX(-' + (idx * (100 / mainMedia.length)) + '%)';
        if (counter) counter.textContent = (idx + 1) + ' / ' + mainMedia.length;
        galleryThumbs.querySelectorAll('.gallery-thumb').forEach((t, i) => {
          t.classList.toggle('active', i === idx);
        });
      }

      // 滑动切换（鼠标 + 触摸，统一用 Pointer Events）
      if (galleryMain) galleryMain.style.touchAction = 'pan-y';
      let pStartX = 0, pCurX = 0, pDragging = false, pMoved = false;
      if (galleryMain && mainMedia.length > 1) {
        galleryMain.addEventListener('pointerdown', (e) => {
          if (e.pointerType === 'mouse' && e.button !== 0) return;
          pDragging = true; pMoved = false;
          pStartX = e.clientX; pCurX = e.clientX;
          if (track) track.style.transition = 'none';
          try { galleryMain.setPointerCapture(e.pointerId); } catch (_) {}
        });
        galleryMain.addEventListener('pointermove', (e) => {
          if (!pDragging) return;
          pCurX = e.clientX;
          if (Math.abs(pCurX - pStartX) > 4) pMoved = true;
          if (!track) return;
          const delta = pCurX - pStartX;
          const base = -(currentImg * (100 / mainMedia.length));
          const pct = base + (delta / galleryMain.clientWidth) * (100 / mainMedia.length);
          track.style.transform = 'translateX(' + pct + '%)';
        });
        const endPointer = () => {
          if (!pDragging) return;
          pDragging = false;
          if (!track) return;
          const delta = pCurX - pStartX;
          const threshold = galleryMain.clientWidth * 0.15;
          if (pMoved) { recentSwipe = true; setTimeout(() => { recentSwipe = false; }, 80); }
          if (delta < -threshold && currentImg < mainMedia.length - 1) showMain(currentImg + 1);
          else if (delta > threshold && currentImg > 0) showMain(currentImg - 1);
          else showMain(currentImg);
          // 非滑动（点击/轻触）打开全屏查看器，绕过指针捕获吞掉 click 的问题
          if (!pMoved && typeof openLightbox === 'function') {
            const f = mainMedia[currentImg];
            const imgIdx = mainImageFiles.indexOf(f);
            if (imgIdx >= 0) {
              recentSwipe = true;
              setTimeout(() => { recentSwipe = false; }, 80);
              openLightbox(lightboxUrls, imgIdx);
            }
          }
        };
        galleryMain.addEventListener('pointerup', endPointer);
        galleryMain.addEventListener('pointercancel', () => { pDragging = false; });
      }

      if (mainMedia.length > 0) {
        showMain(0);
      }

      // 填充 A+ 图片 / 视频（点击图片进 lightbox）
      aplusList.forEach((a, i) => {
        const container = document.getElementById('aplus-' + i);
        if (container) {
          const media = createMedia(mediaSrc(work.folder, a.file), folderName(work.folder) + ' A+ ' + (i + 1), '放A+文件: ' + a.file);
          if (media.tagName === 'IMG') {
            media.style.cursor = 'zoom-in';
            media.addEventListener('click', () => {
              const idx = mainImageFiles.length + aplusImageFiles.indexOf(a);
              openLightbox(lightboxUrls, idx);
            });
          }
          container.appendChild(media);
        }
      });
    }

    // 事件绑定

      if (document.querySelector('.wb-lightbox.active')) return; // 全屏查看器打开时，优先由 lightbox 处理

      if (e.key === 'ArrowLeft' && currentDetailIndex > 0) { currentDetailIndex--; renderDetail(); overlay.scrollTop = 0; }
      if (e.key === 'ArrowRight' && currentDetailIndex < works.length - 1) { currentDetailIndex++; renderDetail(); overlay.scrollTop = 0; }

      function downloadText(text, filename) {
        const blob = new Blob([text], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      }

      function exportEdits() {
        const edits = {};
        document.querySelectorAll('[data-edit]').forEach(el => { edits[el.dataset.edit] = el.innerHTML; });
        if (!Object.keys(edits).length) { alert('当前页面没有可导出的编辑项'); return; }
        const json = JSON.stringify(edits).replace(/</g, '\\u003c');
        const inject = '<script>window.__EDIT_OVERRIDES__ = ' + json + ';<\/script>';
        const filename = (location.pathname.split('/').pop() || 'works.html').split('?')[0];
        const done = (src) => {
          let out = src.replace(/<script>\s*window\.__EDIT_OVERRIDES__\s*=\s*[\s\S]*?<\/script>/gi, '');
          if (/<\/head>/i.test(out)) out = out.replace(/<\/head>/i, inject + '\n</head>');
          else out = inject + '\n' + out;
          downloadText(out, filename);
        };
        fetch(location.href).then(r => r.text()).then(done).catch(() => {
          const clone = document.cloneNode(true);
          clone.body.classList.remove('edit-mode');
          clone.querySelectorAll('[data-edit]').forEach(el => el.removeAttribute('contenteditable'));
          const s = clone.createElement('script');
          s.textContent = 'window.__EDIT_OVERRIDES__ = ' + json + ';';
          clone.head.insertBefore(s, clone.head.firstChild);
          downloadText('<!DOCTYPE html>\n' + clone.documentElement.outerHTML, filename);
        });
        const b = document.querySelector('.btn-export');
        if (b) { const o = b.textContent; b.textContent = '⬇ 已导出'; setTimeout(() => { b.textContent = o; }, 1500); }
      }

      function exitEditMode() {
        document.body.classList.remove('edit-mode');
        document.querySelectorAll('[data-edit]').forEach(el => { el.contentEditable = false; });
        document.getElementById('edit-toolbar').classList.remove('active');
        document.getElementById('edit-hint').classList.remove('active');
      }

      function loadEdits() {
        window.applyEditOverrides && window.applyEditOverrides();
      }

      document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.shiftKey && (e.key === 'E' || e.key === 'e')) {
          e.preventDefault();
          if (document.body.classList.contains('edit-mode')) exitEditMode();
          else enterEditMode();
        }
      });

      const saveBtn = document.querySelector('.btn-save');
      const exitBtn = document.querySelector('.btn-exit');
      const exportBtn = document.querySelector('.btn-export');
      if (saveBtn) saveBtn.addEventListener('click', saveEdits);
      if (exitBtn) exitBtn.addEventListener('click', exitEditMode);
      if (exportBtn) exportBtn.addEventListener('click', exportEdits);

      loadEdits();
    })();

    // 初始化
    renderFilters();
    renderGrid();
  </script>
</body>
</html>
